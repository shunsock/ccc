devShell:
  allowUnfree: false
  package:
    stable:
      - name: cargo
      - name: rustc
      - name: clippy
      - name: rustfmt
      - name: rust-analyzer
    unstable: []
    pinned: []

  shellHook:
    - "echo \"ccc dev environment: $(rustc --version)\""

  task:
    fmt:
      description: "Format Rust sources across the workspace"
      commands:
        - "cargo fmt --all"
    build:
      description: "Build the workspace (debug)"
      commands:
        - "cargo build --workspace"
    review:
      description: "Run a subset of tests via CLI_ARGS"
      commands:
        - "cargo test --workspace {{.CLI_ARGS}}"

  test:
    - "cargo fmt --all --check"
    - "cargo clippy --workspace -- -D warnings"
    - "cargo build --workspace"
    - "cargo test --workspace"
